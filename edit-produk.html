<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Data Barang | Admin MorgadCyber</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #263238; background: #f4f6f7; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .topbar { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: #009688; color: white; }
    .topbar a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 12px; }
    .topbar svg { width: 18px; height: 18px; fill: currentColor; }
    .topbar .user-icon { width: 20px; height: 20px; }
    main { padding: 28px 3.5% 48px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 23px; font-weight: 700; }
    .subheading { margin: 0; color: #647174; font-size: 13px; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .add-button, .primary-button { border: 0; background: #009688; color: #fff; border-radius: 3px; padding: 10px 15px; font-size: 14px; font-weight: 600; }
    .add-button:hover, .primary-button:hover { background: #00796b; }
    .table-panel { border-top: 1px solid #d9e0e2; padding: 15px 1.5% 0; background: #fff; }
    .table-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .table-tools select, .tool-button { height: 37px; border: 1px solid #c8ced0; border-radius: 3px; background: linear-gradient(#fff,#e9e9e9); color: #263238; padding: 0 12px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .tool-button { display: inline-flex; align-items: center; justify-content: center; min-width: 54px; }
    .tool-button:hover { background: #e7eeee; }
    .search-control { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .search-control input { height: 34px; width: min(174px, 42vw); border: 2px solid #dce4e6; border-radius: 4px; padding: 4px 8px; }
    .search-control input:focus, input:focus, textarea:focus, select:focus { outline: 2px solid #80cbc4; outline-offset: 1px; }
    .table-scroll { overflow: auto; }
    table { width: 100%; min-width: 740px; border-collapse: collapse; text-align: left; }
    thead { border-top: 1px solid #a9c8c7; border-bottom: 2px solid #83acab; }
    th { padding: 9px 8px; font-size: 14px; white-space: nowrap; }
    td { padding: 7px 8px; border-bottom: 1px solid #a9c8c7; font-size: 14px; vertical-align: middle; }
    tbody tr:hover { background: #f3faf9; }
    .product-name { min-width: 200px; }
    .product-code { color: #607174; font-size: 12px; }
    .stock-cell { min-width: 64px; }
    .row-actions { display: flex; gap: 5px; }
    .icon-button { width: 40px; height: 32px; border: 0; border-radius: 3px; color: white; display: inline-grid; place-items: center; }
    .icon-button svg { width: 16px; height: 16px; fill: currentColor; }
    .edit-button { background: #009688; }
    .delete-button { background: #e53945; }
    .icon-button:hover { filter: brightness(.9); }
    .table-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0 4px; color: #607174; font-size: 13px; }
    .pagination { display: flex; gap: 4px; }
    .pagination button { min-width: 32px; height: 30px; border: 1px solid #d1d8da; background: white; border-radius: 3px; color: #324144; }
    .pagination button[aria-current="page"] { color: #fff; background: #009688; border-color: #009688; }
    .empty-state, .error-state { padding: 36px 16px; text-align: center; color: #647174; }
    .error-state { color: #b4232f; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px; background: rgb(19 37 39 / 48%); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(580px, 100%); max-height: 92vh; overflow: auto; background: white; border-radius: 5px; box-shadow: 0 14px 40px rgb(0 0 0 / 22%); }
    .modal-header, .modal-footer { display: flex; align-items: center; justify-content: space-between; padding: 15px 19px; border-bottom: 1px solid #e1e7e8; }
    .modal-header h2 { margin: 0; font-size: 18px; }
    .close-button { border: 0; background: transparent; color: #617174; font-size: 24px; line-height: 1; }
    .form-body { padding: 16px 19px 4px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; }
    .field input, .field textarea, .field select { width: 100%; min-height: 37px; border: 1px solid #cad3d5; border-radius: 3px; padding: 8px; }
    .field textarea { min-height: 106px; resize: vertical; }
    .modal-footer { justify-content: flex-end; gap: 8px; border-top: 1px solid #e1e7e8; border-bottom: 0; }
    .secondary-button { padding: 9px 13px; border: 1px solid #cbd4d6; border-radius: 3px; background: white; color: #324144; }
    .form-error { min-height: 18px; padding: 0 19px; color: #b4232f; font-size: 13px; }
    @media (max-width: 620px) {
      main { padding: 20px 14px 36px; }
      .page-heading { align-items: center; }
      .subheading { max-width: 220px; line-height: 1.45; }
      .table-panel { padding-right: 10px; padding-left: 10px; }
      .search-control { width: 100%; margin-left: 0; }
      .search-control input { width: 100%; }
      .table-footer { align-items: flex-start; flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; gap: 0; }
    }
    @media print {
      .topbar, .page-heading button, .table-tools, .row-actions, .table-footer, .modal-backdrop { display: none !important; }
      main { padding: 0; }
      .table-panel { border: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/MorgadAdmin" aria-label="Kembali ke dashboard admin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      <span>Admin</span>
    </a>
    <a href="/api/admin/logout" aria-label="Keluar">
      <svg class="user-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg>
    </a>
  </header>
  <main>
    <div class="page-heading">
      <div><h1>Data Barang</h1><p class="subheading">Daftar produk yang diunggah, stok, dan status publikasi.</p></div>
      <button class="add-button" id="addProductButton" type="button">Tambah</button>
    </div>
    <section class="table-panel" aria-label="Daftar barang">
      <div class="table-tools">
        <label for="rowsPerPage" class="visually-hidden">Jumlah baris</label>
        <select id="rowsPerPage" aria-label="Jumlah baris per halaman"><option value="10">Show 10 rows</option><option value="25">Show 25 rows</option><option value="50" selected>Show 50 rows</option><option value="100">Show 100 rows</option></select>
        <button class="tool-button" id="copyButton" type="button">Copy</button>
        <button class="tool-button" data-export="csv" type="button">CSV</button>
        <button class="tool-button" data-export="excel" type="button">Excel</button>
        <button class="tool-button" id="pdfButton" type="button">PDF</button>
        <button class="tool-button" id="printButton" type="button">Print</button>
        <select id="statusFilter" aria-label="Filter status produk"><option value="current">Produk aktif dan draft</option><option value="all">Semua status</option><option value="archived">Diarsipkan</option></select>
        <label class="search-control" for="productSearch">Search: <input id="productSearch" type="search" autocomplete="off"></label>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th scope="col">No</th><th scope="col">Kode Barang</th><th scope="col">Nama Barang</th><th scope="col">Harga Beli</th><th scope="col">Harga Jual</th><th scope="col">Kategori</th><th scope="col">Stok</th><th scope="col">Status</th><th scope="col">Aksi</th></tr></thead>
          <tbody id="productTableBody"><tr><td colspan="9" class="empty-state">Memuat produk...</td></tr></tbody>
        </table>
      </div>
      <div class="table-footer"><span id="tableInfo" aria-live="polite"></span><nav class="pagination" id="pagination" aria-label="Halaman produk"></nav></div>
    </section>
  </main>

  <div class="modal-backdrop" id="productModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header"><h2 id="modalTitle">Edit Produk</h2><button class="close-button" id="closeModal" type="button" aria-label="Tutup">×</button></div>
      <form id="productForm">
        <div class="form-body">
          <div class="field"><label for="productName">Nama Barang *</label><input id="productName" required maxlength="255"></div>
          <div class="form-grid">
            <div class="field"><label for="productCode">Kode Barang *</label><input id="productCode" required maxlength="200"></div>
            <div class="field"><label for="productCost">Harga Beli</label><input id="productCost" type="number" min="0" step="0.01" placeholder="Belum diatur"></div>
          </div>
          <div class="field">
            <label for="productGoogleDriveId">Google Drive File ID *</label>
            <input id="productGoogleDriveId" type="text" required minlength="10" maxlength="200"
              pattern="[A-Za-z0-9_-]{10,200}" autocomplete="off" spellcheck="false"
              placeholder="1wxkNECH793Z3eNfO8AZDTXptvSe84QGH">
            <small>Masukkan ID file unik dari link share Google Drive Anda (Contoh: 1wxkNECH793Z3eNfO8AZDTXptvSe84QGH)</small>
          </div>
          <div class="form-grid">
            <div class="field"><label for="productPrice">Harga Jual *</label><input id="productPrice" required type="number" min="0.01" step="0.01"></div>
            <div class="field"><label for="productCategory">Kategori *</label><input id="productCategory" required maxlength="100"></div>
          </div>
          <div class="form-grid">
            <div class="field"><label for="productStock">Stok</label><input id="productStock" type="number" min="0" max="1000000" placeholder="Kosong = tidak terbatas"></div>
            <div class="field"><label for="productStatus">Status</label><select id="productStatus"><option value="published">Dipublikasikan</option><option value="draft">Draft</option><option value="archived">Diarsipkan</option></select></div>
          </div>
          <div class="field"><label for="productDescription">Deskripsi *</label><textarea id="productDescription" required maxlength="10000"></textarea></div>
        </div>
        <div class="form-error" id="formError" role="alert"></div>
        <div class="modal-footer"><button class="secondary-button" id="cancelEdit" type="button">Batal</button><button class="primary-button" id="saveProduct" type="submit">Simpan Perubahan</button></div>
      </form>
    </section>
  </div>

  <script>
    const tableBody = document.getElementById('productTableBody');
    const pageSizeSelect = document.getElementById('rowsPerPage');
    const searchInput = document.getElementById('productSearch');
    const statusFilter = document.getElementById('statusFilter');
    const tableInfo = document.getElementById('tableInfo');
    const pagination = document.getElementById('pagination');
    const modal = document.getElementById('productModal');
    let allProducts = [];
    let currentPage = 1;
    let editingProduct = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function displayPrice(amount, currency) {
      try { return new Intl.NumberFormat(currency === 'USD' ? 'en-US' : 'id-ID', { style: 'currency', currency, maximumFractionDigits: currency === 'USD' ? 2 : 0 }).format(amount); }
      catch { return `${currency} ${amount}`; }
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.error || 'Permintaan gagal.');
      return data;
    }

    function filteredProducts() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      return allProducts.filter(product => {
        const matchesStatus = statusFilter.value === 'all'
          || (statusFilter.value === 'archived' ? product.status === 'archived' : product.status !== 'archived');
        const matchesSearch = !query || [product.id, product.slug, product.name, product.category, product.description, product.status].some(value => String(value ?? '').toLocaleLowerCase().includes(query));
        return matchesStatus && matchesSearch;
      });
    }

    function renderTable() {
      const rows = filteredProducts();
      const pageSize = Number(pageSizeSelect.value);
      const pages = Math.max(1, Math.ceil(rows.length / pageSize));
      currentPage = Math.min(currentPage, pages);
      const start = (currentPage - 1) * pageSize;
      const visible = rows.slice(start, start + pageSize);
      if (!visible.length) {
        let emptyMessage = 'Belum ada produk yang diunggah.';
        if (searchInput.value.trim()) emptyMessage = 'Produk tidak ditemukan. Coba kata kunci lain.';
        else if (allProducts.length && statusFilter.value === 'current') emptyMessage = 'Belum ada produk aktif atau draft. Pilih filter “Semua status” atau “Diarsipkan” untuk melihat produk lama.';
        else if (allProducts.length && statusFilter.value === 'archived') emptyMessage = 'Tidak ada produk yang diarsipkan.';
        else if (allProducts.length) emptyMessage = 'Tidak ada produk untuk ditampilkan.';
        tableBody.innerHTML = `<tr><td colspan="9" class="empty-state"><strong>${escapeHtml(emptyMessage)}</strong>${allProducts.length ? '' : '<br><a href="/MorgadAdmin?addProduct=1" style="display:inline-block;margin-top:10px;color:#00796b;font-weight:600;">Tambah produk pertama</a>'}</td></tr>`;
      } else {
        tableBody.innerHTML = visible.map((product, index) => `<tr>
          <td>${start + index + 1}</td>
          <td><span class="product-code">${escapeHtml(product.slug)}</span></td>
          <td class="product-name"><strong>${escapeHtml(product.name)}</strong><br><span class="product-code">${escapeHtml(product.slug)}</span></td>
          <td>${product.cost_price === null ? '—' : escapeHtml(displayPrice(product.cost_price, product.currency || 'IDR'))}</td>
          <td>${escapeHtml(displayPrice(product.price, product.currency || 'IDR'))}</td>
          <td>${escapeHtml(product.category)}</td>
          <td class="stock-cell">${product.stock_quantity === null ? '∞' : Number(product.stock_quantity)}</td>
          <td>${escapeHtml(product.status)}</td>
          <td><div class="row-actions">
            <button class="icon-button edit-button" type="button" data-edit="${escapeHtml(product.id)}" aria-label="Edit ${escapeHtml(product.name)}" title="Edit produk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
            <button class="icon-button delete-button" type="button" data-delete="${escapeHtml(product.id)}" aria-label="Hapus ${escapeHtml(product.name)}" title="Hapus produk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
          </div></td>
        </tr>`).join('');
      }
      tableInfo.textContent = rows.length ? `Menampilkan ${start + 1}–${Math.min(start + pageSize, rows.length)} dari ${rows.length} barang` : 'Menampilkan 0 barang';
      pagination.innerHTML = '';
      for (let page = 1; page <= pages; page += 1) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = String(page);
        if (page === currentPage) button.setAttribute('aria-current', 'page');
        button.addEventListener('click', () => { currentPage = page; renderTable(); });
        pagination.appendChild(button);
      }
      tableBody.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => {
        const product = allProducts.find(item => item.id === button.dataset.edit);
        if (product) openEditor(product);
      }));
      tableBody.querySelectorAll('[data-delete]').forEach(button => button.addEventListener('click', () => deleteProduct(button.dataset.delete)));
    }

    async function loadProducts() {
      tableBody.innerHTML = '<tr><td colspan="9" class="empty-state">Memuat produk...</td></tr>';
      try {
        const data = await api('/api/admin/products');
        allProducts = data.products || [];
        renderTable();
      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="9" class="error-state">${escapeHtml(error.message)}</td></tr>`;
        tableInfo.textContent = '';
      }
    }

    function openEditor(product) {
      editingProduct = product;
      document.getElementById('modalTitle').textContent = `Edit Produk: ${product.name}`;
      document.getElementById('productName').value = product.name || '';
      document.getElementById('productCode').value = product.slug || '';
      document.getElementById('productGoogleDriveId').value = product.google_drive_id || '';
      document.getElementById('productCost').value = product.cost_price ?? '';
      document.getElementById('productPrice').value = product.price ?? '';
      document.getElementById('productCategory').value = product.category || '';
      document.getElementById('productStock').value = product.stock_quantity ?? '';
      document.getElementById('productDescription').value = product.description || '';
      document.getElementById('productStatus').value = product.status || 'draft';
      document.getElementById('formError').textContent = '';
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.getElementById('productName').focus();
    }

    function closeEditor() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      editingProduct = null;
    }

    async function deleteProduct(id) {
      const product = allProducts.find(item => item.id === id);
      if (!product || !confirm(`Hapus "${product.name}" dari katalog? Histori pesanan akan tetap disimpan.`)) return;
      try {
        await api('/api/admin/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete', id }) });
        await loadProducts();
      } catch (error) { alert(error.message); }
    }

    document.getElementById('productForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!editingProduct) return;
      const saveButton = document.getElementById('saveProduct');
      const errorBox = document.getElementById('formError');
      const stockValue = document.getElementById('productStock').value;
      saveButton.disabled = true;
      errorBox.textContent = '';
      try {
        await api('/api/admin/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'update_product', id: editingProduct.id,
            name: document.getElementById('productName').value,
            slug: document.getElementById('productCode').value,
            google_drive_id: document.getElementById('productGoogleDriveId').value.trim(),
            cost_price: document.getElementById('productCost').value === '' ? null : Number(document.getElementById('productCost').value),
            price: Number(document.getElementById('productPrice').value),
            category: document.getElementById('productCategory').value,
            stock_quantity: stockValue === '' ? null : Number(stockValue),
            description: document.getElementById('productDescription').value,
            status: document.getElementById('productStatus').value,
          }),
        });
        closeEditor();
        await loadProducts();
      } catch (error) {
        errorBox.textContent = error.message;
      } finally { saveButton.disabled = false; }
    });

    function exportText(separator = ',') {
      const rows = [['No', 'Kode Barang', 'Nama Barang', 'Harga Beli', 'Harga Jual', 'Kategori', 'Stok', 'Status'], ...filteredProducts().map((product, index) => [index + 1, product.slug, product.name, product.cost_price ?? '', product.price, product.category, product.stock_quantity ?? 'Unlimited', product.status])];
      return rows.map(row => row.map(value => `"${String(value ?? '').replaceAll('"', '""')}"`).join(separator)).join('\n');
    }

    function downloadFile(name, type, content) {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      link.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('addProductButton').addEventListener('click', () => { window.location.href = '/MorgadAdmin?addProduct=1'; });
    document.getElementById('closeModal').addEventListener('click', closeEditor);
    document.getElementById('cancelEdit').addEventListener('click', closeEditor);
    modal.addEventListener('click', event => { if (event.target === modal) closeEditor(); });
    window.addEventListener('keydown', event => { if (event.key === 'Escape') closeEditor(); });
    pageSizeSelect.addEventListener('change', () => { currentPage = 1; renderTable(); });
    statusFilter.addEventListener('change', () => { currentPage = 1; renderTable(); });
    searchInput.addEventListener('input', () => { currentPage = 1; renderTable(); });
    document.getElementById('copyButton').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(exportText('\t')); alert('Data barang disalin.'); }
      catch { alert('Browser tidak mengizinkan akses clipboard.'); }
    });
    document.querySelector('[data-export="csv"]').addEventListener('click', () => downloadFile('data-barang.csv', 'text/csv;charset=utf-8', exportText()));
    document.querySelector('[data-export="excel"]').addEventListener('click', () => downloadFile('data-barang.xls', 'application/vnd.ms-excel;charset=utf-8', exportText('\t')));
    document.getElementById('pdfButton').addEventListener('click', () => window.print());
    document.getElementById('printButton').addEventListener('click', () => window.print());
    loadProducts();
  </script>
</body>
</html>
