<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — MorgadCyber</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .article-read {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .article-read-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--purple-600);
      text-decoration: none;
      margin-bottom: 28px;
    }

    .article-read-back:hover {
      text-decoration: underline;
    }

    .article-read-hero {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 28px;
      background: #f1f5f9;
      aspect-ratio: 16 / 9;
    }

    .article-read-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .article-read-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--color-text-primary);
      margin: 12px 0 16px;
    }

    .article-read-lead {
      font-size: 18px;
      line-height: 1.7;
      color: var(--color-text-secondary);
      margin-bottom: 28px;
    }

    .article-read-body h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-text-primary);
      margin: 32px 0 12px;
      letter-spacing: -0.02em;
    }

    .article-read-body p,
    .article-read-body li {
      font-size: 16px;
      line-height: 1.75;
      color: var(--color-text-secondary);
    }

    .article-read-body p {
      margin-bottom: 16px;
    }

    .article-read-body ul,
    .article-read-body ol {
      padding-left: 22px;
      margin: 0 0 20px;
    }

    .article-read-body li {
      margin-bottom: 8px;
    }

    .article-read-related {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--color-border, #e2e8f0);
    }

    .article-read-related h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--color-text-primary);
    }

    .related-list a {
      display: block;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border-light, #f1f5f9);
      text-decoration: none;
      color: var(--color-text-primary);
      font-weight: 600;
      font-size: 15px;
    }

    .related-list a:hover {
      color: var(--purple-600);
    }

    .article-missing {
      text-align: center;
      padding: 80px 24px;
    }
  </style>
</head>

<body>
  <header class="site-header" id="siteHeader">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon brand-image"><img src="assets/icons/file_0000000037a0720bb851249d9c21dcf7.png" alt="J.S. Morgad Cyber"></div>
        <span>MorgadCyber</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link" data-i18n="home">Home</a></li>
        <li><a href="index.html#trending" class="nav-link" data-i18n="explore">Explore</a></li>
        <li><a href="categories.html" class="nav-link" data-i18n="categories">Categories</a></li>
        <li><a href="artikel.html" class="nav-link active" data-i18n="articles">Articles</a></li>
      </ul>
      <button type="button" class="icon-button theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark and light mode" title="Toggle Dark / Light Mode">◐</button>
      <div class="nav-actions">
        <a href="artikel.html" class="btn-header-cta" data-i18n="allArticles">All Articles</a>
      </div>
    </div>
  </header>

  <main class="article-read" id="articleRead"></main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <div>&copy; 2026 MorgadCyber. <span data-i18n="rights">All rights reserved.</span></div>
        <div class="footer-legal-links">
          <a href="index.html" data-i18n="home">Home</a>
          <a href="artikel.html" data-i18n="allArticles">All Articles</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/language.js"></script>
  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const savedTheme = localStorage.getItem('preferred_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggleBtn?.addEventListener('click', () => {
      const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nextTheme);
      localStorage.setItem('preferred_theme', nextTheme);
    });

    const root = document.getElementById('articleRead');
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id') || params.get('slug');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[character]));
    const tr = (key, values) => window.morgadI18n?.t(key, values) || key;

    function renderArticleMissing() {
      document.title = `${tr('articleNotFound')} — MorgadCyber`;
      root.innerHTML = `
        <div class="article-missing">
          <h1 class="article-read-title">${tr('articleNotFound')}</h1>
          <p class="article-read-lead">${tr('articleUnavailable')}</p>
          <a class="article-read-back" href="artikel.html">${tr('backArticles')}</a>
        </div>
      `;
    }

    function renderArticleContent(article, relatedArticles = []) {
      const image = article.image_url || '/assets/img/logo.png';
      const date = article.published_at ? new Date(article.published_at).toLocaleDateString(window.morgadI18n?.locale() || 'en-US') : '';
      const content = article.content || '';
      const localizedArticle = window.morgadI18n?.article(article.slug);
      const hasHtmlContent = /<\/?[a-z][\s\S]*>/i.test(content);
      const bodyHtml = localizedArticle?.body
        ? localizedArticle.body.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join('')
        : hasHtmlContent
        ? content
        : content
            .split(/\n\s*\n/)
            .filter(Boolean)
            .map((paragraph) => `<p>${escapeHtml(paragraph).replaceAll('\n', '<br>')}</p>`)
            .join('');

      const relatedHtml = relatedArticles.length
        ? relatedArticles
            .map((item) => {
              const localizedRelated = window.morgadI18n?.article(item.slug);
              return `<a href="baca-artikel.html?id=${encodeURIComponent(item.slug)}">${escapeHtml(localizedRelated?.title || item.title)}</a>`;
            })
            .join('')
        : `<a href="artikel.html">${tr('allArticles')}</a>`;

      const displayTitle = localizedArticle?.title || article.title;
      document.title = `${displayTitle} — MorgadCyber`;
      root.innerHTML = `
        <a class="article-read-back" href="artikel.html">← ${tr('backArticles')}</a>
        <div class="article-read-hero">
          <img src="${escapeHtml(image)}" alt="${escapeHtml(displayTitle)}">
        </div>
        <div class="article-meta">
          <span class="article-tag">${escapeHtml(window.morgadI18n?.articleCategory(article.category) || article.category)}</span>
          <span class="article-date">${escapeHtml(date)}</span>
        </div>
        <h1 class="article-read-title">${escapeHtml(displayTitle)}</h1>
        <p class="article-read-lead">${escapeHtml(localizedArticle?.summary || article.summary || '')}</p>
        <div class="article-read-body">${bodyHtml}</div>
        <div class="article-read-related">
          <h2>${tr('relatedArticles', { category: escapeHtml(window.morgadI18n?.articleCategory(article.category) || article.category) })}</h2>
          <div class="related-list">${relatedHtml}</div>
        </div>
      `;
    }

    async function loadArticle() {
      if (!articleId) {
        renderArticleMissing();
        return;
      }

      try {
        const response = await fetch(`/api/articles?slug=${encodeURIComponent(articleId)}`);
        const result = await response.json();

        if (!response.ok || !result.success || !result.article) {
          renderArticleMissing();
          return;
        }

        const article = result.article;
        const relatedResponse = await fetch('/api/articles');
        const relatedPayload = await relatedResponse.json();
        const relatedArticles = relatedResponse.ok && relatedPayload.success && Array.isArray(relatedPayload.articles)
          ? relatedPayload.articles.filter((item) => item.slug !== article.slug && item.category === article.category).slice(0, 3)
          : [];

        renderArticleContent(article, relatedArticles);
      } catch {
        renderArticleMissing();
      }
    }

    loadArticle();
    window.addEventListener('morgad-language-change', loadArticle);
  </script>
</body>

</html>
