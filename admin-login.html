<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - MorgadCyber</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; }
    .shell { width: min(1040px, 100%); min-height: 600px; display: grid; grid-template-columns: .92fr 1.08fr; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; box-shadow: 0 16px 36px rgba(15,23,42,.1); }
    .visual { position: relative; display: flex; align-items: flex-end; overflow: hidden; padding: 42px; color: #fff; background: #30251c; }
    .visual::after { display: none; }
    .visual-content { position: relative; z-index: 1; max-width: 330px; }
    .kicker { color: #e0b982; font-size: 11px; font-weight: 800; }
    h1 { margin: 16px 0 10px; font-size: 34px; line-height: 1.12; letter-spacing: 0; }
    .visual p { margin: 0; color: #e5ddd2; font-size: 14px; line-height: 1.6; }
    .panel { display: flex; flex-direction: column; justify-content: center; padding: 64px 76px 42px; }
    .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 22px; border-radius: 8px; color: #fff; background: #985316; }
    .panel h2 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.03em; }
    .subtitle { margin: 0 0 34px; color: #64748b; font-size: 14px; }
    label { display: block; margin-bottom: 7px; color: #0f172a; font-size: 14px; font-weight: 600; }
    .field { width: 100%; margin-bottom: 20px; padding: 13px 14px; border: 1px solid #e2e8f0; border-radius: 9px; color: #0f172a; background: #fff; font: inherit; outline: none; }
    .field:focus { border-color: #985316; box-shadow: 0 0 0 3px #f0dfc9; }
    .password-wrap { position: relative; }
    .password-wrap .field { padding-right: 48px; }
    .toggle { position: absolute; top: 50%; right: 12px; display: grid; place-items: center; padding: 4px; border: 0; color: #64748b; background: transparent; transform: translateY(-50%); cursor: pointer; }
    .error { margin-bottom: 20px; padding: 12px 14px; border: 1px solid #fecaca; border-radius: 9px; color: #b91c1c; background: #fef2f2; font-size: 13px; }
    .submit { width: 100%; margin-top: 8px; padding: 13px 16px; border: 0; border-radius: 6px; color: #fff; background: #985316; font: inherit; font-weight: 700; cursor: pointer; }
    .submit:hover { background: #7f4315; }
    .submit:disabled { cursor: wait; opacity: .65; }
    .footer { margin-top: auto; color: #94a3b8; font-size: 12px; }
    @media (max-width: 760px) { .shell { grid-template-columns: 1fr; min-height: auto; border-radius: 20px; } .visual { min-height: 250px; padding: 28px; } .visual h1 { font-size: 27px; } .panel { padding: 38px 26px 28px; } .footer { margin-top: 34px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="visual" aria-hidden="true">
      <div class="visual-content">
        <span class="kicker">MORGAD CYBER</span>
        <h1>Kelola produk dan pesanan.</h1>
        <p>Perbarui katalog, pantau pembayaran, dan atur akses unduhan dari satu panel.</p>
      </div>
    </section>
    <section class="panel">
      <div class="brand-mark" aria-hidden="true">M</div>
      <h2>Masuk ke Admin</h2>
      <p class="subtitle">Masuk ke panel administrasi Morgad.</p>
      <div id="error" class="error" role="alert" hidden></div>
      <form id="loginForm">
        <label for="identifier">Email atau username</label>
        <input class="field" id="identifier" name="identifier" type="text" autocomplete="username" placeholder="admin@example.com atau nama admin" required>
        <label for="password">Password</label>
        <div class="password-wrap">
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
          <button class="toggle" id="togglePassword" type="button" aria-label="Tampilkan password">Show</button>
        </div>
        <button class="submit" id="submitButton" type="submit">Masuk ke Dashboard</button>
      </form>
      <p class="footer">Morgad Admin Panel &copy; 2026</p>
    </section>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');
    const submitButton = document.getElementById('submitButton');
    const password = document.getElementById('password');
    document.getElementById('togglePassword').addEventListener('click', (event) => {
      const button = event.currentTarget;
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      button.textContent = visible ? 'Show' : 'Hide';
      button.setAttribute('aria-label', visible ? 'Tampilkan password' : 'Sembunyikan password');
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      submitButton.disabled = true;
      submitButton.textContent = 'Memproses...';
      try {
        const response = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifier: document.getElementById('identifier').value, password: password.value }) });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Email atau password salah.');
        window.location.href = '/MorgadAdmin';
      } catch (loginError) {
        error.textContent = loginError.message || 'Terjadi kesalahan. Coba lagi.';
        error.hidden = false;
        submitButton.disabled = false;
        submitButton.textContent = 'Masuk ke Dashboard';
      }
    });
  </script>
</body>
</html>
