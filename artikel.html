<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Articles — MorgadCyber</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .articles-page-header {
      padding: 60px 0 30px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border, #e2e8f0);
    }

    .articles-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 28px 0 24px;
    }

    .articles-filter-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--color-border, #e2e8f0);
      background: #ffffff;
      color: #475569;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .articles-filter-chip:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .articles-filter-chip.active {
      background: var(--purple-600);
      color: #ffffff;
      border-color: var(--purple-600);
    }

    .articles-count {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }

    @media (max-width: 1024px) {
      .article-grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    [data-theme="dark"] .articles-page-header {
      background: var(--color-bg);
    }

    [data-theme="dark"] .articles-filter-chip {
      background: var(--color-surface);
      border-color: var(--color-border);
      color: var(--color-text-secondary);
    }

    [data-theme="dark"] .articles-filter-chip.active {
      background: var(--purple-600);
      color: #ffffff;
      border-color: var(--purple-600);
    }
  </style>
</head>

<body>
  <header class="site-header" id="siteHeader">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon brand-image"><img src="assets/icons/file_0000000037a0720bb851249d9c21dcf7.png" alt="J.S. Morgad Cyber"></div>
        <span>MorgadCyber</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link" data-i18n="home">Home</a></li>
        <li><a href="index.html#trending" class="nav-link" data-i18n="explore">Explore</a></li>
        <li><a href="categories.html" class="nav-link" data-i18n="categories">Categories</a></li>
        <li><a href="artikel.html" class="nav-link active" data-i18n="articles">Articles</a></li>
      </ul>
      <button type="button" class="icon-button theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark and light mode" title="Toggle Dark / Light Mode">◐</button>

      <div class="nav-actions">
        <a href="index.html#trending" class="btn-header-cta">
          <span data-i18n="exploreProducts">Explore Products</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <section class="articles-page-header">
    <div class="container">
      <div
        style="font-size: 12px; font-weight: 700; color: var(--purple-600); text-transform: uppercase; margin-bottom: 8px;">
        <span data-i18n="articleKicker">MorgadCyber</span>
      </div>
      <h1 style="font-size: 36px; font-weight: 800; color: var(--color-text-primary); margin: 0 0 10px; letter-spacing: 0;">
        <span data-i18n="articleTitle">Articles</span>
      </h1>
      <p style="font-size: 15px; color: var(--color-text-secondary); margin: 0; max-width: 650px; line-height: 1.6;">
        <span data-i18n="articleIntro">Research, updates, and guides published by the MorgadCyber team.</span>
      </p>
    </div>
  </section>

  <main class="container" style="padding: 0 0 80px;">
    <div class="articles-filters" id="articleFilters">
      <button type="button" class="articles-filter-chip active" data-tag="all" data-i18n="all">All</button>
    </div>

    <div class="articles-count" id="articleCount" data-i18n="loadingArticles">Loading articles...</div>

    <div class="article-grid-3" id="articleGrid" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <div>&copy; 2026 MorgadCyber. <span data-i18n="rights">All rights reserved.</span></div>
        <div class="footer-legal-links">
          <a href="index.html" data-i18n="home">Home</a>
          <a href="index.html#articles" data-i18n="articles">Articles</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/language.js"></script>
  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const savedTheme = localStorage.getItem('preferred_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggleBtn?.addEventListener('click', () => {
      const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nextTheme);
      localStorage.setItem('preferred_theme', nextTheme);
    });
    const chips = [...document.querySelectorAll('#articleFilters .articles-filter-chip')];
    const grid = document.getElementById('articleGrid');
    const count = document.getElementById('articleCount');
    let cards = [];
    grid.replaceChildren();
    let activeTag = 'all';

    function applyArticleFilter() {
      let visible = 0;
      cards.forEach(card => {
        const matches = activeTag === 'all' || card.dataset.tag === activeTag;
        card.style.display = matches ? 'flex' : 'none';
        if (matches) visible += 1;
      });
      count.textContent = window.morgadI18n?.t('articleCount', { count: visible }) || `Showing ${visible} articles`;
    }

    chips.forEach(chip => chip.addEventListener('click', () => {
      chips.forEach(item => item.classList.remove('active'));
      chip.classList.add('active');
      activeTag = chip.dataset.tag;
      applyArticleFilter();
    }));

    async function loadPublishedArticles() {
      try {
        const response = await fetch('/api/articles');
        const data = await response.json();
        if (!response.ok || !data.success || !Array.isArray(data.articles)) {
          count.textContent = window.morgadI18n?.t('articlesLoadError') || 'Articles could not be loaded.';
          return;
        }
        if (!data.articles.length) {
          count.textContent = window.morgadI18n?.t('noArticles') || 'No articles have been published yet.';
          return;
        }
        data.articles.forEach(article => {
          const card = document.createElement('a');
          card.href = `baca-artikel.html?id=${encodeURIComponent(article.slug)}`;
          card.className = 'article-card';
          card.dataset.tag = article.category;
          const imageContainer = document.createElement('div');
          imageContainer.className = 'article-image-container';
          const image = document.createElement('img');
          image.src = article.image_url || '/assets/img/logo.png';
          image.onerror = () => { image.src = '/assets/img/logo.png'; };
          image.alt = article.title;
          image.className = 'article-image';
          image.loading = 'lazy';
          imageContainer.appendChild(image);
          const body = document.createElement('div');
          body.className = 'article-body';
          const meta = document.createElement('div');
          meta.className = 'article-meta';
          const tag = document.createElement('span');
          tag.className = 'article-tag';
          tag.textContent = window.morgadI18n?.articleCategory(article.category) || article.category;
          const date = document.createElement('span');
          date.className = 'article-date';
          date.textContent = article.published_at ? new Date(article.published_at).toLocaleDateString(window.morgadI18n?.locale() || 'en-US') : '';
          meta.append(tag, date);
          const title = document.createElement('h3');
          title.className = 'article-title';
          const localized = window.morgadI18n?.article(article.slug);
          title.textContent = localized?.title || article.title;
          const summary = document.createElement('p');
          summary.className = 'article-summary';
          summary.textContent = localized?.summary || article.summary;
          const link = document.createElement('span');
          link.className = 'article-link';
          link.textContent = `${window.morgadI18n?.t('readMore') || 'Read article'} →`;
          body.append(meta, title, summary, link);
          card.append(imageContainer, body);
          grid.appendChild(card);
        });
        cards = [...grid.querySelectorAll('.article-card')];
        grid.hidden = false;
        applyArticleFilter();
      } catch {
        count.textContent = 'Artikel belum dapat dimuat.';
      }
    }

    applyArticleFilter();
    loadPublishedArticles();
    window.addEventListener('morgad-language-change', () => {
      grid.replaceChildren();
      cards = [];
      loadPublishedArticles();
    });
  </script>
</body>

</html>
